
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO Form</title>
</head>
<body>
    <h1>TO-DO Form</h1>

    <form action="/submittodoitem" method="POST">
        <label for="task">Task name</label>
        <input type="text" id="task" name="task" required>

        <br><br>

        <label for="task_description">Description of Task</label>
        <input type="text" id="task_description"
               name="task_description" required>

        <br><br>

        <button type="submit">Submit</button>
    </form>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}

    {% if item %}
        <h2>Generated Item Details</h2>
        <p>Item ID: {{ item.item_id }}</p>
        <p>Item UUID: {{ item.item_uuid }}</p>
        <p>Item Hash: {{ item.item_hash }}</p>

        <h2>Submitted Item</h2>

        <label>Item ID:</label>
        <input type="text" value="{{ item.item_id }}" readonly>

        <br><br>

        <label>Item UUID:</label>
        <input type="text" value="{{ item.item_uuid }}" readonly>

    {% endif %}
</body>
</html>
